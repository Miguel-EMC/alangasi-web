name: Publicar web de Fernanda Morales

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar y preparar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos y enlaces internos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          required = [
              "index.html", "styles.css", "app.js",
              "creditos.html", "privacidad.html",
              "assets/favicon.svg",
              "assets/fernanda-portrait.webp",
              "assets/alangasi-horizonte.webp",
              "assets/hero-campaign-bg.webp",
              "assets/alangasi-panorama.webp",
              "assets/vias-alangasi.webp",
              "assets/comunidad-el-tingo.webp",
              "assets/cultura-el-tingo.webp",
              "assets/fiesta-el-tingo.webp",
              "assets/tradicion-el-tingo.webp",
          ]
          missing = [name for name in required if not (root / name).is_file() or (root / name).stat().st_size == 0]
          if missing:
              raise SystemExit("Faltan archivos de la web: " + ", ".join(missing))

          sources = [root / "index.html", root / "styles.css", root / "creditos.html", root / "privacidad.html"]
          referenced_assets = set()
          for source in sources:
              text = source.read_text(encoding="utf-8")
              referenced_assets.update(re.findall(r"assets/[a-zA-Z0-9_./-]+(?:webp|svg|png|jpg|jpeg)", text))
          missing_references = [name for name in sorted(referenced_assets) if not (root / name).is_file()]
          if missing_references:
              raise SystemExit("Imágenes no encontradas: " + ", ".join(missing_references))
          print(f"Validación OK: {len(required)} archivos, {len(referenced_assets)} referencias locales.")
          PY

      - name: Preparar carpeta pública
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js creditos.html privacidad.html _site/
          cp -R assets/. _site/assets/
          touch _site/.nojekyll

      - name: Subir archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar página pública
        id: deployment
        uses: actions/deploy-pages@v4
