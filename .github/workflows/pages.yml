name: Validar y publicar sitio de Fernanda Morales

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-alangasi
  cancel-in-progress: true

jobs:
  publicar:
    name: Verificar sitio y publicar rama gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar archivos necesarios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          required = [
              "index.html", "styles.css", "app.js", "creditos.html", "privacidad.html",
              "assets/favicon.svg", "assets/fernanda-portrait.webp",
              "assets/alangasi-horizonte.webp", "assets/alangasi-panorama.webp",
              "assets/vias-alangasi.webp", "assets/comunidad-el-tingo.webp",
              "assets/cultura-el-tingo.webp", "assets/fiesta-el-tingo.webp",
              "assets/tradicion-el-tingo.webp"
          ]
          missing = [name for name in required if not Path(name).is_file() or Path(name).stat().st_size == 0]
          if missing:
              raise SystemExit("Faltan recursos del sitio: " + ", ".join(missing))
          print("Sitio validado: HTML, estilos, scripts y fotografías presentes.")
          PY

      - name: Preparar directorio de publicación
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/alangasi-site"
          mkdir -p "$publish_dir/assets"
          cp index.html styles.css app.js creditos.html privacidad.html "$publish_dir/"
          cp -R assets/. "$publish_dir/assets/"
          touch "$publish_dir/.nojekyll"

      - name: Publicar en gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi

          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -R "$RUNNER_TEMP/alangasi-site/." .
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para publicar."
          else
            git commit -m "deploy: actualizar sitio estático de Alangasí [skip ci]"
            git push origin HEAD:gh-pages
            echo "Contenido actualizado en rama gh-pages."
          fi
